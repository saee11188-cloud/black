<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="تطبيق لياقتي اليومي - تمارين رياضية ونصائح غذائية يومية">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="src/images/icon.png">
    <link rel="apple-touch-icon" href="src/images/icon.png">
    <title>تطبيق لياقتي اليومي</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>
    <div class="background-glob"></div>
    <div class="background-glob two"></div>

    <div class="container">
        <header class="main-header">
            <h1>لياقتي اليوم</h1>
            <p id="current-date">الجمعة، 5 ديسمبر 2025</p>
        </header>

        <!-- Progress Section -->
        <section class="progress-section">
            <div class="progress-info">
                <span class="progress-label">تقدمك اليوم</span>
                <span class="progress-percent" id="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </section>

        <main class="dashboard">
            <!-- Nutrition Section -->
            <section class="card nutrition-card">
                <div class="card-icon">🍎</div>
                <h2>نصيحة غذائية</h2>
                <div class="content">
                    <p id="nutrition-tip">جاري تحميل النصيحة...</p>
                    <div class="source-badge">دراسة طبية معتمدة</div>
                </div>
            </section>

            <!-- Workout Section -->
            <section class="card workout-card">
                <div class="card-header">
                    <div class="card-icon">💪</div>
                    <div>
                        <h2>تمرين اليوم</h2>
                        <span class="muscle-group" id="muscle-group">تحميل...</span>
                    </div>
                </div>

                <div class="exercises-list" id="exercises-list">
                    <!-- Exercises will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Completion Modal -->
    <div class="modal-overlay" id="completion-modal">
        <div class="modal-content">
            <div class="modal-icon">🏆</div>
            <h2>أحسنت! أتممت تمرينك اليوم</h2>
            <p class="motivational-quote" id="motivational-quote"></p>
            <button class="modal-btn" id="close-modal">متابعة</button>
        </div>
    </div>

    <script src="src/js/data.js"></script>
    <script src="src/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.log('SW Registration Failed:', err));
        }
    </script>
</body>

</html>
